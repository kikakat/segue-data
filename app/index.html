<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Segue</title>
<meta name="description" content="Finished something? Here's what's next. Picks across books, manga, shows, movies, games, board games and music.">
<meta name="theme-color" content="#F6F4FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110F1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Segue">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="appbar" id="appbar">
  <h1 id="title">Discover</h1>
  <button class="iconbtn" id="btn-search" aria-label="Search" data-t-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
  <button class="iconbtn" id="btn-settings" aria-label="Settings" data-t-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
</header>

<main id="main">
  <div class="splash" id="splash">Opening Segue&hellip;</div>
  <section class="view" id="v-discover" hidden></section>
  <section class="view" id="v-next" hidden></section>
  <section class="view" id="v-library" hidden></section>
  <section class="view" id="v-you" hidden></section>
</main>

<button class="fab" id="fab" hidden><svg class="i"><use href="#i-check"/></svg><span data-t="Finished">Finished</span></button>

<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-tab="discover"><span class="pill"><svg class="i"><use href="#i-compass"/></svg></span><span data-t="Discover">Discover</span></button>
  <button class="tab" data-tab="next"><span class="pill"><svg class="i"><use href="#i-bookmark"/></svg></span><span data-t="Up next">Up next</span><span class="badge" id="next-badge" hidden></span></button>
  <button class="tab" data-tab="library"><span class="pill"><svg class="i"><use href="#i-books"/></svg></span><span data-t="Library">Library</span></button>
  <button class="tab" data-tab="you"><span class="pill"><svg class="i"><use href="#i-user"/></svg></span><span data-t="You">You</span></button>
</nav>

<div id="onb" class="onb" hidden></div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
